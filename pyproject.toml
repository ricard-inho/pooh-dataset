[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pooh-dataset"
dynamic = ["version"]
description = "Download, synchronize and turn the POOH multimodal robotics dataset (events, RGB-D, lidar, mocap) into pose-estimation, detection, segmentation and optical-flow training data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ricard Marsal", email = "ricard.marsal@uni.lu" }]
keywords = ["robotics", "event-camera", "pose-estimation", "optical-flow", "dataset", "huggingface", "motion-capture"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.23",
    "pyarrow>=14",
    "huggingface_hub>=0.23",
    "pillow>=9.0",
    "pyyaml>=6.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# PyTorch Dataset wrappers (pooh_dataset.torch)
torch = ["torch>=2.0"]
# Loading CAD meshes (.ply/.obj/.stl) for mask / box rendering
mesh = ["trimesh>=4.0"]
# Synchronized playback dashboard (pooh viz). Rerun's API moves fast: tested with 0.38.
viz = ["rerun-sdk>=0.38"]
# pooh calibrate / align-markers (the click page itself needs nothing extra)
calib = ["trimesh>=4.0"]
all = ["pooh-dataset[torch,mesh,viz,calib]"]

[project.urls]
Homepage = "https://github.com/ricard-inho/pooh-dataset"
Issues = "https://github.com/ricard-inho/pooh-dataset/issues"
Documentation = "https://github.com/ricard-inho/pooh-dataset#readme"
Dataset = "https://huggingface.co/datasets/r3m3c3/off_test"

[project.scripts]
pooh = "pooh_dataset.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "trimesh>=4.0", "rerun-sdk>=0.38"]

[tool.hatch.version]
path = "src/pooh_dataset/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pooh_dataset"]

[tool.hatch.build.targets.sdist]
include = ["src/pooh_dataset", "tests", "README.md", "DATA_REQUIREMENTS.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
